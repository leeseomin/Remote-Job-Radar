name: Crawl browser sources

on:
  schedule:
    # 09:43 and 21:43 Asia/Seoul (UTC+9)
    - cron: "43 0,12 * * *"
  workflow_dispatch:

concurrency:
  group: remote-job-radar-crawl-browser
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @remote-job-radar/crawler exec playwright install --with-deps chromium
      - name: Crawl browser-only sources
        run: pnpm crawl:browser
        env:
          CRAWLEE_STORAGE_DIR: ${{ runner.temp }}/remote-job-radar-crawlee
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          INGEST_BEARER_TOKEN: ${{ secrets.INGEST_BEARER_TOKEN }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-browser-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
