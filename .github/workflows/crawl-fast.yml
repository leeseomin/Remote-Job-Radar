name: Crawl fast sources

on:
  schedule:
    # 09:17 and 21:17 Asia/Seoul (UTC+9)
    - cron: "17 0,12 * * *"
  workflow_dispatch:

concurrency:
  group: remote-job-radar-crawl-fast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Crawl ATS, JSON-LD, and static HTML sources
        run: pnpm crawl:fast
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          INGEST_BEARER_TOKEN: ${{ secrets.INGEST_BEARER_TOKEN }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-fast-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
